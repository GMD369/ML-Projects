<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SMS Spam Detector</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Machine Learning Project 06</p>
      <h1>SMS Spam Detector</h1>
      <p class="intro">Paste a message to estimate the probability that it is spam.</p>
      <form id="prediction-form">
        <label for="message">SMS message</label>
        <textarea id="message" maxlength="5000" required placeholder="Congratulations! You won a free prize. Call now."></textarea>
        <button type="submit">Analyze message</button>
      </form>
      <section id="result" class="result hidden" aria-live="polite">
        <p id="label" class="prediction"></p>
        <div class="meter"><div id="meter-fill"></div></div>
        <p id="probability"></p>
      </section>
      <p id="error" class="error hidden" aria-live="assertive"></p>
    </main>
    <script>
      const form = document.querySelector("#prediction-form");
      const result = document.querySelector("#result");
      const error = document.querySelector("#error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.classList.add("hidden");
        error.classList.add("hidden");
        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: document.querySelector("#message").value })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Prediction failed");
          const percent = data.spam_probability * 100;
          const label = document.querySelector("#label");
          label.textContent = data.label.toUpperCase();
          label.className = `prediction ${data.label}`;
          document.querySelector("#probability").textContent = `Spam probability: ${percent.toFixed(1)}%`;
          document.querySelector("#meter-fill").style.width = `${percent}%`;
          result.classList.remove("hidden");
        } catch (problem) {
          error.textContent = problem.message;
          error.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
